<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chao Ni</title>
<meta name="description" content="Chao Ni works on the machine learning side of robotics, building humanoids at Hexagon.">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231b1a17'/><text x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23f7f5f1' text-anchor='middle'>CN</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5f1;
    --fg: #1b1a17;
    --muted: #6d6a63;
    --rule: #dedad2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --fg: #eceae4; --muted: #949087; --rule: #2b2a27; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: clamp(24px, 8vw, 96px);
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(38rem, 100%); }
  h1 {
    margin: 0 0 1.25rem;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: clamp(2.25rem, 7vw, 3.25rem);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0 0 2.5rem;
    max-width: 34rem;
    font-size: clamp(1rem, 2.2vw, 1.125rem);
    color: var(--muted);
  }
  p a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--rule); }
  p a:hover { border-color: currentColor; }
  nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; font-size: 0.875rem; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover, nav a:focus-visible { color: var(--fg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Chao Ni</h1>
  <p>I work on the machine learning side of robotics, building humanoids at <a href="https://robotics.hexagon.com/">Hexagon</a>.</p>
  <nav aria-label="Elsewhere">
    <a href="mailto:nichao.dev@gmail.com">Email</a>
    <a href="https://www.linkedin.com/in/chao-ni-27593518b/">LinkedIn</a>
    <a href="https://github.com/chaofiber">GitHub</a>
  </nav>
</main>
</body>
</html>
